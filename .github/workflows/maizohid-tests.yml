name: Maizo HID tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  hid-parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test HID descriptor parser and DS2 translator
        run: |
          cc -std=c99 -Wall -Wextra -Werror -Iinclude -Imodules/pademu \
            modules/pademu/maizohid.c tests/maizohid_test.c -o /tmp/maizohid_test
          /tmp/maizohid_test
      - name: Test PadEmu port 2, multitap and SIO2 safety
        run: |
          cc -std=c99 -Wall -Wextra -Werror -Iinclude -Imodules/pademu \
            tests/maizo_pademu_test.c -o /tmp/maizo_pademu_test
          /tmp/maizo_pademu_test
      - name: Test menu routing for P1, P2 and multitap USB HID
        run: |
          cc -std=c99 -Wall -Wextra -Werror -Iinclude \
            tests/maizo_menu_input_test.c -o /tmp/maizo_menu_input_test
          /tmp/maizo_menu_input_test
      - name: Test captured Xbox 360 045e:028e packets
        run: |
          cc -std=c99 -Wall -Wextra -Werror -Iinclude -Imodules/pademu \
            tests/maizox360_test.c -o /tmp/maizox360_test
          /tmp/maizox360_test
      - name: Test dual-player 0810:0001 receiver packets
        run: |
          cc -std=c99 -Wall -Wextra -Werror -Iinclude -Imodules/pademu \
            tests/maizotwin_test.c -o /tmp/maizotwin_test
          /tmp/maizotwin_test
      - name: Test MAIZO Store streaming SHA-256
        run: |
          cc -std=c99 -Wall -Wextra -Werror -Iinclude \
            tests/maizo_store_sha256_test.c -o /tmp/maizo_store_sha_test
          /tmp/maizo_store_sha_test
      - name: Test MAIZO IGR navigation (host)
        run: |
          cc -std=c99 -Wall -Wextra -Werror -Iee_core/include \
            tests/maizo_igr_state_test.c -o /tmp/maizo_igr_state_test
          /tmp/maizo_igr_state_test
      - name: Verify game profile validation and corruption detection
        run: |
          cc -std=c99 -Wall -Wextra -Werror -Iee_core/include tests/maizo_igr_profile_test.c -o /tmp/maizo_igr_profile_test
          /tmp/maizo_igr_profile_test
      - name: Verify real GS deflicker and sharp/smooth gates
        run: |
          cc -std=c99 -Wall -Wextra -Werror -Iee_core/include \
            tests/maizo_igr_filter_test.c -o /tmp/maizo_igr_filter_test
          /tmp/maizo_igr_filter_test
      - name: Validate GS GIF drawing filter safety and packet decoding
        run: |
          cc -std=c99 -Wall -Wextra -Werror -Iee_core/include \
            tests/maizo_gs_gif_filter_test.c -o /tmp/maizo_gs_gif_test
          /tmp/maizo_gs_gif_test
      - name: Verify owned-path PATH3 GIF DMA pre-submit safety
        run: |
          cc -std=c99 -Wall -Wextra -Werror -Iee_core/include \
            tests/maizo_gs_dma_preflight_test.c -o /tmp/maizo_gs_dma_preflight
          /tmp/maizo_gs_dma_preflight
      - name: Verify trusted PATH3 REF chains and cooperative PATH1 staging
        run: |
          cc -std=c99 -Wall -Wextra -Werror -Iee_core/include \
            tests/maizo_gs_trusted_refs_test.c -o /tmp/maizo_gs_trusted_refs
          /tmp/maizo_gs_trusted_refs
      - name: Validate MAIZO GS opt-in runtime and fail-closed menu controls
        run: |
          cc -std=c99 -Wall -Wextra -Werror -Iee_core/include \
            ee_core/src/maizo_gs_runtime.c tests/maizo_gs_runtime_test.c \
            -o /tmp/maizo_gs_runtime
          /tmp/maizo_gs_runtime
      - name: Validate mixed VIF1 PATH2 streams with opaque VU commands
        run: |
          cc -std=c99 -Wall -Wextra -Werror -Iee_core/include \
            tests/maizo_gs_vif1_mixed_test.c -o /tmp/maizo_gs_vif1_mixed
          /tmp/maizo_gs_vif1_mixed
      - name: Validate reversible graphics shadow staging
        run: |
          cc -std=c99 -Wall -Wextra -Werror -Iee_core/include \
            ee_core/src/maizo_gs_runtime.c tests/maizo_gs_shadow_test.c \
            -o /tmp/maizo_gs_shadow
          /tmp/maizo_gs_shadow
      - name: Validate in-game read-only GS PATH monitor
        run: |
          cc -std=c99 -Wall -Wextra -Werror -Iee_core/include \
            tests/maizo_gs_probe_test.c -o /tmp/maizo_gs_probe
          /tmp/maizo_gs_probe
      - name: Validate native progressive to NTSC 480i FRAME gates
        run: |
          cc -std=c99 -Wall -Wextra -Werror -Iee_core/include \
            tests/maizo_gs_480i_bridge_test.c -o /tmp/maizo_gs_480i_bridge
          /tmp/maizo_gs_480i_bridge
      - name: Check stack budget rejects Beta-82 704-byte runtime
        run: python3 tests/check_ee_core_stack_test.py
      - name: Verify expanded module arena and legacy fallback bounds
        run: |
          cc -std=c99 -Wall -Wextra -Werror -Iee_core/include \
            tests/maizo_ee_layout_test.c -o /tmp/maizo_ee_layout_test
          /tmp/maizo_ee_layout_test
      - name: Check passive GS scanout capture safety (GSM OFF)
        run: |
          cc -std=c99 -Wall -Wextra -Werror -Iee_core/include \
            tests/maizo_igr_monitor_test.c -o /tmp/maizo_igr_monitor_test
          /tmp/maizo_igr_monitor_test
      - name: Ensure In-Game shortcut never falls through to Browser reset
        run: |
          cc -std=c99 -Wall -Wextra -Werror -Iee_core/include \
            tests/maizo_igr_route_test.c -o /tmp/maizo_igr_route
          /tmp/maizo_igr_route
      - name: Verify GSM flags offsets shared with EE ASM
        run: |
          cc -std=c99 -Wall -Wextra -Werror -Iee_core/include \
            tests/maizo_igr_gsm_layout_test.c -o /tmp/maizo_igr_layout
          /tmp/maizo_igr_layout
      - name: Verify live VIF1/GIF pipeline preflight rejects partial packets
        run: |
          cc -std=c99 -Wall -Wextra -Werror -Iee_core/include \
            tests/maizo_igr_pipeline_test.c -o /tmp/maizo_igr_pipeline
          /tmp/maizo_igr_pipeline
      - name: Verify verified-TLS MAIZO Store contracts
        run: python3 tests/maizo_store_contract_test.py
      - name: Check Supreme integration contract
        run: python3 tests/supreme_contract_test.py
      - name: Test dashboard library and hotplug selection
        run: |
          cc -std=c99 -Wall -Wextra -Werror -fsanitize=address,undefined -Iinclude \
            src/maizo_library.c tests/maizo_library_test.c -o /tmp/maizo_library_test
          /tmp/maizo_library_test
      - name: Install PNG test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libpng-dev pkg-config
      - name: Test real PNG decoder with malformed artwork
        run: python3 tests/texture_host_test.py
      - name: Test streaming CheatDevice ZIP database and identity isolation
        run: python3 tests/maizo_cheatdb_test.py
      - name: Test cheat selection identity and duplicate labels
        run: python3 tests/maizo_cheatselection_test.py
