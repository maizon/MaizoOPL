name: Maizo HID tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  hid-parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test HID descriptor parser and DS2 translator
        run: |
          cc -std=c99 -Wall -Wextra -Werror -Iinclude -Imodules/pademu \
            modules/pademu/maizohid.c tests/maizohid_test.c -o /tmp/maizohid_test
          /tmp/maizohid_test
      - name: Test dual-player 0810:0001 receiver packets
        run: |
          cc -std=c99 -Wall -Wextra -Werror -Iinclude -Imodules/pademu \
            tests/maizotwin_test.c -o /tmp/maizotwin_test
          /tmp/maizotwin_test
      - name: Check Supreme integration contract
        run: python3 tests/supreme_contract_test.py
      - name: Test dashboard library and hotplug selection
        run: |
          cc -std=c99 -Wall -Wextra -Werror -fsanitize=address,undefined -Iinclude \
            src/maizo_library.c tests/maizo_library_test.c -o /tmp/maizo_library_test
          /tmp/maizo_library_test
      - name: Install PNG test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libpng-dev pkg-config
      - name: Test real PNG decoder with malformed artwork
        run: python3 tests/texture_host_test.py
