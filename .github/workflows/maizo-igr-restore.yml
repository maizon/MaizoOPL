name: MAIZO In-Game PRO restoration laboratory
on:
  push:
    branches: [feat/recovery-b-ingame-pro-safe]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restore:
    runs-on: ubuntu-latest
    container: ghcr.io/ps2homebrew/ps2homebrew:main
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 -m pip install --break-system-packages -r requirements.txt
      - name: Test backup integrity and boot isolation
        run: |
          cc -std=c99 -Wall -Wextra -Werror tests/maizo_restore_integrity_test.c -o /tmp/mzr-integrity
          /tmp/mzr-integrity
          cc -std=c99 -Wall -Wextra -Werror tests/maizo_restore_guard_test.c -o /tmp/mzr-guard
          /tmp/mzr-guard
          cc -std=c99 -Wall -Wextra -Werror tests/maizo_restore_sync_test.c -o /tmp/mzr-sync
          /tmp/mzr-sync
          cc -std=gnu99 -Wall -Wextra -Iee_core/include tests/maizo_gs_client_test.c -o /tmp/mzr-checkpoint
          /tmp/mzr-checkpoint
          python3 tests/maizo_igr_boot_isolation_test.py
      - name: Build and validate independent restoration components
        run: |
          make -C modules/iopcore/maizo_restore
          make -C ee_core/overlay MAIZO_MAGE_SKY_EXPERIMENTAL=1 MAIZO_IGR_RESTORE_EXPERIMENTAL=1
          python3 scripts/check_maizo_overlay.py
      - name: Build opt-in restoration ELF with existing stack guard
        run: |
          set -o pipefail
          make clean
          make --trace release MAIZO_IGR_EXPERIMENTAL=1 MAIZO_MAGE_SKY_EXPERIMENTAL=1 MAIZO_IGR_RESTORE_EXPERIMENTAL=1 MAIZO_IGR_OVERLAY_EXPERIMENTAL=1 2>&1 | tee restore.log
      - name: Validate actual overlay ELF and reserved memory
        run: python3 scripts/check_maizo_overlay.py
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MAIZO-IGR-RESTORE-EXPERIMENTAL
          path: OPNPS2LD-*.ELF
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: MAIZO-RESTORE-BUILD-ERROR
          path: |
            restore.log
            ee_core/ee_core.map
            ee_core/overlay/maizo_overlay.map
