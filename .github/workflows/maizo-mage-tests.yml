name: MAGE resolver tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  mage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate independent reviewed patch selection
        run: python3 tests/maizo_mage_test.py
      - name: Validate RenderWare policy and existing In-Game mode bridge
        run: |
          cc -std=c99 -Wall -Wextra -Werror -Iee_core/include tests/maizo_mage_rw_test.c -o /tmp/mage-rw
          /tmp/mage-rw
      - name: Live menu and runtime controls
        run: |
          cc -std=c99 -Wall -Wextra -Werror -Iee_core/include tests/maizo_igr_state_test.c -o /tmp/mage-menu
          /tmp/mage-menu
          cc -std=c99 -Wall -Wextra -Werror -Iee_core/include ee_core/src/maizo_gs_runtime.c tests/maizo_gs_runtime_test.c -o /tmp/mage-live
          /tmp/mage-live
          cc -std=c99 -Wall -Wextra -Werror -Iee_core/include tests/maizo_gs_gif_filter_test.c -o /tmp/mage-gif
          /tmp/mage-gif
      - name: Validate reversible Sky table policy
        run: |
          cc -std=c99 -Wall -Wextra -Werror -Iee_core/include tests/maizo_mage_sky_test.c -o /tmp/mage-sky
          /tmp/mage-sky
          python3 -m py_compile scripts/maizo_mage_sky_evidence.py
          python3 tests/maizo_mage_sky_discover_test.py
      - name: Compact profile and FIELD scanout gates
        run: |
          cc -std=c99 -Wall -Wextra -Werror -Iinclude tests/maizo_mage_profile_test.c -o /tmp/mage-profile
          /tmp/mage-profile
          cc -std=c99 -Wall -Wextra -Werror -Iee_core/include tests/maizo_igr_filter_test.c -o /tmp/mage-filter
          /tmp/mage-filter
      - name: Fine geometry and legacy profile regression
        run: |
          cc -std=c99 -Wall -Wextra -Werror -Iee_core/include tests/maizo_igr_monitor_test.c -o /tmp/mage-geometry
          /tmp/mage-geometry
          cc -std=c99 -Wall -Wextra -Werror -Iee_core/include tests/maizo_igr_profile_test.c -o /tmp/mage-profile-geometry
          /tmp/mage-profile-geometry
      - name: Existing exact-revision installer
        run: python3 tests/maizo_gs_install_elf_test.py
